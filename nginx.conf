server {
    listen 80;
    listen 443 ssl;

    server_name backend.cupidocol.com;

    ssl_certificate     /etc/letsencrypt/live/backend.cupidocol.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.cupidocol.com/privkey.pem;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # ============================
    # WebSockets (Daphne en 8001)
    # ============================
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============================
    # API REST (Gunicorn en 8000)
    # ============================
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
